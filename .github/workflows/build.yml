name: build.yml

on: [push, pull_request]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@master

    - name: Setup
      uses: actions/setup-java@master
      with:
        java-version: '21'
        distribution: 'oracle'

    - name: Test
      run: ./gradlew testReleaseUnitTest

    - name: Build
      run: ./gradlew assembleRelease

    - name: Verify 16 KB native library alignment
      run: |
        rm -rf /tmp/vox-aliena-apk
        mkdir -p /tmp/vox-aliena-apk
        unzip -q vox-aliena/build/outputs/apk/release/vox-aliena-release.apk 'lib/*/*.so' -d /tmp/vox-aliena-apk
        python3 - <<'PY'
        import pathlib
        import subprocess
        import sys

        root = pathlib.Path("/tmp/vox-aliena-apk/lib")
        libraries = sorted(
            list(root.glob("arm64-v8a/*.so")) +
            list(root.glob("x86_64/*.so")))
        if not libraries:
            sys.exit("No 64-bit native libraries found in APK")

        failed = []
        for library in libraries:
            output = subprocess.check_output(
                ["readelf", "-lW", str(library)], text=True)
            alignments = [
                int(fields[-1], 16)
                for line in output.splitlines()
                if (fields := line.split()) and fields[0] == "LOAD"
            ]
            minimum = min(alignments, default=0)
            print(f"{library}: minimum LOAD alignment 0x{minimum:x}")
            if minimum < 0x4000:
                failed.append(str(library))

        if failed:
            sys.exit("Native libraries are not 16 KB aligned: " + ", ".join(failed))
        PY

    - name: Lint
      run: ./gradlew lintRelease
